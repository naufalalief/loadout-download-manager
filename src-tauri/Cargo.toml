[package]
name = "loadout"
version = "1.0.0"
description = "A download manager: multi-segment downloads, browser-extension handoff, and yt-dlp-powered video extraction"
authors = ["Naufal Alief"]
license = "MIT"
repository = "https://github.com/naufalalief/loadout-download-manager"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["stream", "cookies"] }
axum = "0.8.9"
uuid = { version = "1.29.2", features = ["v4"] }
rand = "0.10.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
dirs = "7.0.0"
zip = "2"
sha2 = "0.10"
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"

# Pinned to the exact version tauri 2.12.5 itself depends on (see its
# Cargo.toml) -- the COM types `main.rs` calls back into (via
# `PlatformWebview::controller()`) must be the same crate version to be
# the same Rust type, not just structurally identical.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"

[dev-dependencies]
wiremock = "0.6.5"
