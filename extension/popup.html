<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loadout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="mark">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4" /><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
      </div>
      <div class="t">Loadout</div>
    </div>

    <div class="body">
      <div class="statusrow"><span class="dot" id="status-dot"></span><span id="status">Checking…</span></div>
      <div class="sub">Right-click or hover a video on this page to fetch it.</div>

      <div id="last-sent-section" class="hidden">
        <div class="lastcap">Last sent</div>
        <div class="lastrow">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          <span class="n" id="last-sent-label"></span>
        </div>
      </div>
    </div>

    <div class="footer">
      <button type="button" class="link" id="options-link">Options</button>
      <span class="v" id="popup-version"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
